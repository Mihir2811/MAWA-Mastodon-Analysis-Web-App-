@*
 * Basic HTML layout: navigation, Bootstrap 5 CDN, shared container and footer.
 * @author Qiang Xue
 *@
@(title: String)(content: Html)

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>@title - MAWA</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/main.css")">
        <link rel="shortcut icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="@routes.Assets.versioned("javascripts/chart.js")"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand" href="@routes.HomeController.index()">🐘 MAWA</a>
                <span class="text-muted small">Mastodon Analysis Web App</span>
            </div>
        </nav>

        <main class="container mb-5">
            @content
        </main>

        <footer class="container text-center text-muted small py-4 border-top">
            <p class="mb-0">MAWA - SOEN 6441 Group Project | Powered by Play Framework &amp; Mastodon REST API</p>
        </footer>
    </body>
</html>
