# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile
mastodon {
  instance = "mastodon.social"
  instance = ${?MASTODON_INSTANCE}
  token = ""
  token = ${?MASTODON_ACCESS_TOKEN}

  # Number of posts requested per page, i.e. the size of one result page.
  # The Mastodon API returns at most 40 statuses per request, so values above 40 are capped at 40.
  pageSize = 40
  pageSize = ${?MASTODON_PAGE_SIZE}
}

play.filters.disabled += play.filters.hosts.AllowedHostsFilter
